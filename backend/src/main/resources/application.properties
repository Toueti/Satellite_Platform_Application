# MySQL Configuration
# spring.datasource.url=jdbc:mysql://localhost:3307/satellitedb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=11444592
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.application.name=Satellite_Platform_Application


# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}
logging.level.org.springframework.data.mongodb=DEBUG
spring.data.mongodb.auto-index-creation=true

spring.main.allow-bean-definition-overriding=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


#image config
python.backend.url=${PYTHON_BASE_URL}
image.storage.path=${IMAGE_STORAGE_PATH}
thread.pool.size=4

# Spring Boot Configuration
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework=DEBUG

# Spring Boot Actuator Configuration
# Expose specific endpoints instead of all (*) for better security.
# Common endpoints: health, info, metrics, env, loggers
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
# Base path for actuator endpoints (default is /actuator)
# management.endpoints.web.base-path=/actuator
# Note: Security for these endpoints should be configured in SecurityConfig.java

# Redis Configuration
spring.data.redis.url=${REDIS_URL}

springdoc.swagger-ui.path=/swagger-ui.html

project.base.path=${PROJECT_BASE_PATH}

# Rate Limiting
rate_limit.max_requests=10
rate_limit.time_window_millis=60000
rate-limit.cleanup-interval=300000

# Analysis Types
analysis.valid_types=ndvi,evi,water-bodies,change-detection,land-cover,slope,aspect,get_images

# Cache Configuration
cache.redis.ttl_seconds=604800
cache.redis.prefix=cache:data:
cache.cleanup.max_infrequent_access_count=3
cache.cleanup.inactivity_threshold_days=2
cache.cleanup.cron=0 0 3 * * ?

# Disable Spring Cloud Config check
spring.cloud.config.enabled=false


# --- Initial Admin User Configuration (Optional) ---
# If enabled=true and these properties are set, the first admin user
# will be created on startup if no admin user currently exists.
# IMPORTANT: Change the default password in a real deployment!
app.initial.admin.enabled=${ADMIN_ENABLED}
app.initial.admin.username=${ADMIN_USERNAME}
app.initial.admin.email=${ADMIN_EMAIL}
app.initial.admin.password=${ADMIN_PASSWORD}



# Spring Boot Audit log Configuration
audit.log.path=/logs


# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}


messaging.attachments.max.size=10
messaging.attachments.allowed.types=jpg,jpeg,png,pdf,doc,docx,txt
